<vbox id="zotero-prefpane-tag-picker"
	xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	xmlns:html="http://www.w3.org/1999/xhtml">

	<hbox align="center">
		<description flex="1">How each setting works, plus the picker's keys, Remove and Undo:</description>
		<button id="tp-help" label="Tag Picker Help…"/>
	</hbox>

	<groupbox>
		<label><html:h2>Where tags come from</html:h2></label>
		<radiogroup id="tp-source" preference="extensions.tagpicker.source">
			<radio value="library" label="Tags already used in this library"/>
			<description class="tp-choice-note">Every tag on at least one item in the library you're tagging in: My Library, or the group library the selected items belong to. Tags from your other libraries, tags only on items in the trash, and automatic tags (unless ticked below) are left out. Colored tags are always included. The list grows on its own as you tag.</description>
			<radio value="file" label="A text file of tags (one per line)"/>
			<description class="tp-choice-note">Only the tags in a file you keep, which is handy for a fixed vocabulary or for sharing one list across libraries and computers. Tags in your library that aren't in the file won't be offered.</description>
			<radio value="both" label="Both, merged"/>
			<description class="tp-choice-note">Everything from the library plus everything in the file, with duplicates shown once. Usage counts come from the library.</description>
		</radiogroup>
		<checkbox label="Library: include automatic tags (from journal databases), not just ones you added"
			preference="extensions.tagpicker.includeAutomatic"/>
		<hbox align="center">
			<label value="Tag file:"/>
			<html:input id="tp-filepath" type="text" style="flex: 1"
				preference="extensions.tagpicker.filePath"/>
			<button id="tp-browse" label="Browse…"/>
		</hbox>
		<checkbox label="Save newly typed tags to the tag file (when it's a source)"
			preference="extensions.tagpicker.saveNewToFile"/>
		<description>These choices are for adding. Remove Tags always lists exactly the tags on the selected items.</description>
	</groupbox>

	<groupbox>
		<label><html:h2>Capitalization</html:h2></label>
		<radiogroup preference="extensions.tagpicker.caseMode">
			<radio value="lower" label="always lowercase"/>
			<radio value="upper" label="ALWAYS UPPERCASE"/>
			<radio value="title" label="Capitalize Each Word"/>
			<radio value="asis" label="Exactly as typed (existing tags keep their own case)"/>
		</radiogroup>
		<description>Applies to every tag the picker adds, and to how the list is shown. Colored tags always keep their exact name.</description>
	</groupbox>

	<groupbox>
		<label><html:h2>List order</html:h2></label>
		<radiogroup preference="extensions.tagpicker.sortOrder">
			<radio value="frequency" label="Most-used first"/>
			<radio value="alpha" label="Alphabetical"/>
		</radiogroup>
		<checkbox label="Show colored tags first, in their number-key order"
			preference="extensions.tagpicker.pinColored"/>
	</groupbox>

	<groupbox>
		<label><html:h2>Keyboard shortcuts</html:h2></label>
		<description>Click a box, then press the keys you want. Backspace clears it; Esc leaves it as it was.</description>
		<html:div class="tp-shortcut-grid">
			<label value="Add tags:"/>
			<html:input id="tp-shortcut" class="tp-recorder" type="text" readonly="readonly"
				preference="extensions.tagpicker.shortcut"/>
			<button id="tp-shortcut-clear" label="Clear"/>
			<label value="Remove tags:"/>
			<html:input id="tp-remove-shortcut" class="tp-recorder" type="text" readonly="readonly"
				preference="extensions.tagpicker.removeShortcut"/>
			<button id="tp-remove-shortcut-clear" label="Clear"/>
		</html:div>
		<description id="tp-shortcut-message" style="font-weight: bold" hidden="true"/>
		<description>The standard Add shortcut is Ctrl+Alt+T (Cmd+Option+T on a Mac). "Add Tags…" and "Remove Tags…" are also on the item right-click menu. To reverse a change, use Edit › Undo.</description>
	</groupbox>

	<html:style>
		.tp-shortcut-grid {
			display: grid;
			grid-template-columns: max-content 14em max-content;
			gap: 6px 8px;
			align-items: center;
			margin: 6px 0;
		}
		.tp-recorder {
			cursor: pointer;
		}
		.tp-choice-note {
			margin: 0 0 6px 26px;
			font-size: 0.92em;
			opacity: 0.8;
		}
		.tp-recorder.recording {
			outline: 2px solid SelectedItem;
		}
	</html:style>
</vbox>
