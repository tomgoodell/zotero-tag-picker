<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/"?>
<?xml-stylesheet href="chrome://zotero/skin/zotero.css" type="text/css"?>

<window
	xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	xmlns:html="http://www.w3.org/1999/xhtml"
	id="zotero-tag-picker-dialog"
	title="Tag Picker"
	width="460"
	height="560"
	persist="screenX screenY width height"
	onload="TagPickerDialog.init()">

	<script src="chrome://zotero-tag-picker/content/picker.js"/>

	<!-- The styles live here rather than in a separate .css file: Zotero keeps a plugin's
	     stylesheets in memory until it restarts, so an updated plugin would keep showing
	     the old look. This window file is read fresh each time it opens. -->
	<html:style><![CDATA[
		#zotero-tag-picker-dialog {
			background: Canvas;
			color: CanvasText;
		}

		#tp-root {
			display: flex;
			flex-direction: column;
			height: 100vh;
			box-sizing: border-box;
			padding: 12px;
			gap: 8px;
			font-size: 13px;
		}

		/* Add/Remove, the Add list's source, automatic tags and Help, wrapping onto
		   more lines as the window narrows */
		#tp-topbar {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 6px 12px;
		}

		.tp-seg {
			display: flex;
			gap: 0;
		}

		#tp-modes {
			flex: 1 1 190px;
		}

		.tp-seg.tp-option {
			flex: none;
			align-items: center;
		}

		/* Remove mode lists the tags on the items, so how the Add list is built doesn't apply */
		.tp-removing #tp-topbar .tp-option {
			display: none;
		}

		.tp-seg-label {
			margin-right: 5px;
			opacity: 0.8;
		}

		/* The ID in each selector outranks Zotero's own button styles, which otherwise
		   paint all the buttons alike */
		#tp-topbar .tp-seg > button {
			appearance: none;
			margin: 0;
			padding: 5px 8px;
			border: 1px solid color-mix(in srgb, CanvasText 30%, transparent);
			background: color-mix(in srgb, CanvasText 6%, Canvas);
			color: color-mix(in srgb, CanvasText 65%, transparent);
			font-weight: normal;
			white-space: nowrap;
		}

		#tp-topbar #tp-modes > button {
			flex: 1;
		}

		#tp-topbar .tp-option > button {
			padding: 4px 8px;
			font-size: 12px;
		}

		#tp-topbar .tp-seg > button:first-of-type {
			border-radius: 4px 0 0 4px;
		}

		#tp-topbar .tp-seg > button:not(:first-of-type) {
			border-left: none;
		}

		#tp-topbar .tp-seg > button:last-of-type {
			border-radius: 0 4px 4px 0;
		}

		#tp-topbar .tp-seg > button:hover {
			background: color-mix(in srgb, SelectedItem 15%, Canvas);
		}

		#tp-topbar .tp-seg > button.selected {
			background: SelectedItem;
			color: SelectedItemText;
			border-color: SelectedItem;
			font-weight: bold;
		}

		#tp-topbar #tp-modes > button.selected::before {
			content: "✓ ";
		}

		/* Remove mode: red, so it's obvious tags are coming off */
		.tp-removing #tp-topbar #tp-modes > button.selected {
			background: #c0392b;
			border-color: #c0392b;
			color: #fff;
		}

		#tp-auto-label {
			display: flex;
			align-items: center;
			gap: 4px;
			white-space: nowrap;
		}

		#tp-auto {
			margin: 0;
		}

		/* Remove mode: tint the picks so it's obvious they're coming off */
		.tp-removing .tp-chip {
			background: color-mix(in srgb, #c0392b 22%, Canvas);
			text-decoration: line-through;
		}

		.tp-dot {
			display: inline-block;
			flex: none;
			width: 9px;
			height: 9px;
			border-radius: 50%;
			margin-right: 7px;
			align-self: center;
		}

		.tp-dot.none {
			visibility: hidden;
		}

		.tp-empty {
			padding: 6px 8px;
			opacity: 0.6;
			font-style: italic;
		}

		/* No margin: Zotero's input style adds one, which pushed the box past the list's right edge */
		#tp-search {
			width: 100%;
			box-sizing: border-box;
			margin: 0;
			font-size: 14px;
			padding: 6px 8px;
		}

		#tp-hint {
			margin-top: 4px;
			font-size: 11px;
			opacity: 0.7;
		}

		#tp-warning {
			margin-top: 4px;
			color: #c0392b;
			font-size: 12px;
		}

		#tp-list {
			flex: 1;
			overflow-y: auto;
			border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
			border-radius: 4px;
		}

		.tp-row {
			display: flex;
			padding: 3px 8px;
			cursor: default;
		}

		.tp-row:hover {
			background: color-mix(in srgb, SelectedItem 15%, Canvas);
		}

		.tp-row.highlight {
			background: SelectedItem;
			color: SelectedItemText;
		}

		.tp-row.chosen .tp-name::before {
			content: "✓ ";
		}

		.tp-name {
			flex: 1;
		}

		.tp-count {
			opacity: 0.6;
			font-variant-numeric: tabular-nums;
			margin-left: 12px;
		}

		.tp-row.new .tp-name {
			font-style: italic;
		}

		#tp-chosen-row {
			display: flex;
			align-items: flex-start;
			gap: 6px;
			min-height: 26px;
		}

		#tp-chosen-label {
			padding-top: 3px;
			opacity: 0.8;
		}

		#tp-chosen {
			display: flex;
			flex-wrap: wrap;
			gap: 4px;
		}

		.tp-chip {
			display: inline-flex;
			align-items: center;
			gap: 4px;
			padding: 2px 8px;
			border-radius: 10px;
			background: color-mix(in srgb, SelectedItem 20%, Canvas);
		}

		.tp-chip-x {
			cursor: pointer;
			opacity: 0.7;
		}

		.tp-chip-x:hover {
			opacity: 1;
		}

		#tp-footer {
			display: flex;
			align-items: center;
			gap: 8px;
		}

		#tp-help {
			min-width: 0;
			margin: 0 0 0 auto;
			padding: 2px 9px;
			font-weight: bold;
		}

		#tp-status {
			flex: 1;
			font-size: 11px;
			opacity: 0.7;
		}
	]]></html:style>

	<html:div id="tp-root">
		<html:div id="tp-topbar">
			<html:div id="tp-modes" class="tp-seg" role="tablist">
				<html:button id="tp-mode-add" class="tp-mode" role="tab">Add tags</html:button>
				<html:button id="tp-mode-remove" class="tp-mode" role="tab">Remove tags</html:button>
			</html:div>
			<html:div id="tp-sources" class="tp-seg tp-option" role="group" aria-label="Tags from">
				<html:span class="tp-seg-label">From:</html:span>
				<html:button id="tp-source-file" title="Only the tags in your tag file">File</html:button>
				<html:button id="tp-source-library" title="Tags already used in this library">Library</html:button>
				<html:button id="tp-source-both" title="The library and the tag file, merged">Both</html:button>
			</html:div>
			<html:div id="tp-sort" class="tp-seg tp-option" role="group" aria-label="Sort">
				<html:span class="tp-seg-label">Sort:</html:span>
				<html:button id="tp-sortOrder-frequency" title="Tags on the most items first">Most used</html:button>
				<html:button id="tp-sortOrder-alpha" title="Alphabetical">A–Z</html:button>
			</html:div>
			<html:label id="tp-auto-label" class="tp-option" title="Also offer automatic tags (added by Zotero from publisher and database keywords)">
				<html:input id="tp-auto" type="checkbox"/>
				Automatic tags
			</html:label>
			<html:button id="tp-help" title="Help (F1)">?</html:button>
		</html:div>
		<html:div id="tp-header">
			<html:input id="tp-search" type="text" autocomplete="off"/>
			<html:div id="tp-hint"/>
			<html:div id="tp-warning" hidden="hidden"/>
		</html:div>
		<html:div id="tp-list" role="listbox" tabindex="-1"/>
		<html:div id="tp-chosen-row">
			<html:span id="tp-chosen-label"/>
			<html:div id="tp-chosen"/>
		</html:div>
		<html:div id="tp-footer">
			<html:span id="tp-status"/>
			<html:button id="tp-cancel">Cancel</html:button>
			<html:button id="tp-apply" class="primary">Add</html:button>
		</html:div>
	</html:div>
</window>
